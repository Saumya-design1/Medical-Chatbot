<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-2 sm:p-6">

    <!-- Main Container -->
    <div class="w-full max-w-4xl h-[90vh] bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900/80 border-b border-slate-700/80 px-6 py-4 flex items-center justify-between backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400">
                    <i class="fa-solid fa-heart-pulse text-xl"></i>
                </div>
                <div>
                    <h1 class="text-white font-semibold text-lg leading-tight">Medical AI Assistant</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        RAG Engine Connected
                    </p>
                </div>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                Medical_book.pdf
            </div>
        </div>

        <!-- Chat Container -->
        <div id="chatbox" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 chat-scroll bg-slate-800/50">
            
            <!-- Welcome Message -->
            <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                <div class="w-8 h-8 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400 shrink-0 mt-1">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="bg-slate-700/60 text-slate-200 border border-slate-600/50 p-4 rounded-2xl rounded-tl-none shadow-sm text-sm leading-relaxed">
                    Hello! I am your AI Medical Assistant trained on your internal reference materials. How can I assist you today?
                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="p-4 bg-slate-900/90 border-t border-slate-700/80">
            <form id="chat-form" class="flex items-center gap-2">
                <div class="relative flex-1">
                    <input type="text" id="user-input" placeholder="Ask a medical question..." autocomplete="off"
                        class="w-full bg-slate-800 text-white placeholder-slate-400 border border-slate-700 rounded-xl px-4 py-3.5 pr-10 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition text-sm" required />
                </div>
                <button type="submit" id="send-btn"
                    class="bg-teal-600 hover:bg-teal-500 text-white px-5 py-3.5 rounded-xl font-medium text-sm flex items-center gap-2 transition active:scale-95 disabled:opacity-50">
                    <span>Send</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        $(document).ready(function() {
            const chatbox = $("#chatbox");

            function scrollToBottom() {
                chatbox.scrollTop(chatbox[0].scrollHeight);
            }

            $("#chat-form").on("submit", function(e) {
                e.preventDefault();
                const inputField = $("#user-input");
                const userMsg = inputField.val().trim();
                if (!userMsg) return;

                // Append User Message
                const userHtml = `
                    <div class="flex items-start justify-end gap-3 max-w-[85%] sm:max-w-[75%] ml-auto">
                        <div class="bg-teal-600 text-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm leading-relaxed">
                            ${escapeHtml(userMsg)}
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center text-white shrink-0 mt-1 shadow-md">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                    </div>
                `;
                chatbox.append(userHtml);
                inputField.val("");
                scrollToBottom();

                // Append Typing Indicator
                const loadingId = "loading-" + Date.now();
                const loadingHtml = `
                    <div id="${loadingId}" class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                        <div class="w-8 h-8 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400 shrink-0 mt-1">
                            <i class="fa-solid fa-robot text-sm"></i>
                        </div>
                        <div class="bg-slate-700/60 text-slate-300 border border-slate-600/50 p-4 rounded-2xl rounded-tl-none text-sm flex items-center gap-2">
                            <span class="text-xs text-slate-400">Searching medical database...</span>
                            <i class="fa-solid fa-circle-notch animate-spin text-teal-400 text-xs"></i>
                        </div>
                    </div>
                `;
                chatbox.append(loadingHtml);
                scrollToBottom();

                // Send AJAX Request to Flask
                $.ajax({
                    data: { msg: userMsg },
                    type: "POST",
                    url: "/get",
                }).done(function(data) {
                    $(`#${loadingId}`).remove();
                    const botHtml = `
                        <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                            <div class="w-8 h-8 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400 shrink-0 mt-1">
                                <i class="fa-solid fa-robot text-sm"></i>
                            </div>
                            <div class="bg-slate-700/60 text-slate-100 border border-slate-600/50 p-4 rounded-2xl rounded-tl-none shadow-sm text-sm leading-relaxed">
                                ${escapeHtml(data)}
                            </div>
                        </div>
                    `;
                    chatbox.append(botHtml);
                    scrollToBottom();
                }).fail(function() {
                    $(`#${loadingId}`).remove();
                    const errorHtml = `
                        <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                            <div class="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shrink-0 mt-1">
                                <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                            </div>
                            <div class="bg-rose-950/40 text-rose-200 border border-rose-800/50 p-4 rounded-2xl rounded-tl-none text-sm">
                                Failed to retrieve response. Please check your connection or server logs.
                            </div>
                        </div>
                    `;
                    chatbox.append(errorHtml);
                    scrollToBottom();
                });
            });

            function escapeHtml(text) {
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        });
    </script>
</body>
</html>
